spring.application.name=student-management
server.port=8080

# --- Base de donnees MySQL (XAMPP / MariaDB, port 3306) ---
spring.datasource.url=jdbc:mysql://localhost:3306/studentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Spring Data REST (expose sous /api/data pour ne pas gener le controleur /students) ---
spring.data.rest.base-path=/api/data

# --- Reponses d'erreur lisibles (pas de stacktrace dans le JSON) ---
server.error.include-stacktrace=never
server.error.include-message=always

# --- Swagger / springdoc-openapi ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
